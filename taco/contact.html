<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Egbo Chukwuebuka Promise" />
    <meta name="decription" content="Contact info for the little taco shop" />

    <title>Contact us - LTS</title>
    <link rel="icon" href="fav icon.avif" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" type="text/css" />
    <script src="main.js" defer></script>
  </head>

  <body>
    <header class="header">
      <h1 class="header__h1">Little Taco Shop</h1>
      <nav class="header__nav">
        <ul class="header__ul">
          <li>
            <a href="/">Home</a>
          </li>
          <li>
            <a href="/#menue">Menue</a>
          </li>
          <li>
            <a href="hours.html">Hours</a>
          </li>
          <li>
            <a href="about.html">About</a>
          </li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <figure>
        <img
          src="images.jpg"
          alt="little taco shop tacos"
          title="Tacos we love to eat"
          height="667"
          width="1000"
        />
        <figcaption class="offscreen">Little Taco shop Tacos.</figcaption>
      </figure>
    </section>

    <main class="main">
      <article class="main__article contact">
        <h2 class="contact__h2">Our Location</h2>
        <address>
          555 Taco Temptation Lane, Suite T <br />
          Kansas City, MO 5555555-55555 <br /><br />
          Phone: <a href="tel:+234-813-859-3141">+234-813-859-3141</a>
        </address>
      </article>
      <hr />
      <article class="main__article">
        <h2>Our Contact form</h2>
        <form
          action="https://httpbin.org/get"
          method="get"
          class="contact__form"
        >
          <fieldset class="contact__fieldset">
            <legend class="offscreen">Send us a message.</legend>
            <p class="contact__p">
              <label class="contact__label" for="name">Name:</label>
              <input
                class="contact__input"
                type="text"
                name="name"
                id="name"
                placeholder="Your full name"
                required
              />
            </p>
            <p class="contact__p">
              <label class="contact__label" for="email">Email:</label>
              <input
                class="contact__input"
                type="email"
                email="email"
                id="email"
                placeholder="Your email"
                required
              />
            </p>
            <p class="contact__p">
              <label class="contact__label" for="message">Comment Here:</label>
              <br />
              <textarea
                class="contact__textarea"
                name="message"
                id="message"
                cols="30"
                rows="10"
                placeholder="type your message here"
              ></textarea>
            </p>
          </fieldset>
          <button class="contact__button" type="submit">Send</button>
          <button class="contact__button" type="reset">Reset</button>
        </form>
      </article>
    </main>

    <footer class="footer">
      <p>
        <span class="nowrap">Copyright &copy; <time id="year"></time></span>
        <span class="nowrap">Little Taco Shop.</span>
      </p>
    </footer>
  </body>
</html>
